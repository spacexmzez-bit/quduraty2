<!DOCTYPE html>
<!-- File: index.html — Quduraty complete frontend, manual sync edition. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قدراتي — بنك الأسئلة ومعاني الكلمات</title>
<style>
:root{--bg:#0b1120;--card-bg:#151f32;--border:#24324d;--primary:#38bdf8;--accent:#f59e0b;--success:#10b981;--danger:#ef4444;--text:#f1f5f9;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);padding:12px;font-size:15px}.container{max-width:850px;margin:auto}header{margin-bottom:16px;border-bottom:1px solid var(--border);padding:20px 0 12px}.top-bar,.toolbar,.actions,.section-head,.group-head,.item-card-header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top-bar{margin-bottom:12px}h1{font-size:1.25rem;color:var(--primary)}h2{font-size:1.2rem}h3{font-size:1.05rem}.nav-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav-tabs button{font-size:.85rem;padding:10px 4px}.actions{justify-content:flex-start}button{background:var(--card-bg);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--primary);color:#021226;border:none;font-weight:600}button.success{background:var(--success);color:white;border:none}button.danger{background:var(--danger);color:white;border:none}button.accent{background:var(--accent);color:#021226;border:none}button.active{border-color:var(--primary);background:#1e3a8a;color:white}button.icon-btn{padding:6px 10px}.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.form-group{display:flex;flex-direction:column;gap:6px;margin:12px 0}label,.muted{color:var(--text-muted);font-size:.85rem}input,select,textarea{background:var(--bg);border:1px solid var(--border);color:white;padding:10px;border-radius:8px;font-size:.95rem;width:100%}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}textarea{resize:vertical}input[type=radio]{width:auto}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle-group{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}.toggle-group button{flex:1;border:none;border-radius:0;background:var(--bg);color:var(--text-muted)}.toggle-group button.selected{background:var(--primary);color:#021226}.group-box{background:#131d32;border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}.group-head{background:#1a2744;padding:12px;border-bottom:1px solid var(--border)}.section-box{border-right:3px solid var(--primary);background:var(--card-bg);margin:10px;border-radius:6px;padding:10px}.section-head{margin-bottom:8px}.item-card{background:#0e1626;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}.item-card-header{align-items:flex-start}.star-btn{background:none;border:none;color:#475569;font-size:1.3rem;padding:2px 6px}.star-btn.starred{color:var(--accent)}.badge{font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:600;display:inline-block}.badge-quant{background:#3b82f6}.badge-verbal{background:#8b5cf6}.options-grid{display:grid;grid-template-columns:1fr;gap:6px;margin:10px 0}.option-cell,.quiz-option{background:#080d1a;padding:8px 10px;border-radius:6px;border:1px solid var(--border);font-size:.9rem}.option-cell.correct{border-color:var(--success);color:var(--success);font-weight:bold}.quiz-option{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text);margin:6px 0}.text{white-space:pre-wrap;overflow-wrap:anywhere}.media-preview{width:100%;max-height:250px;object-fit:contain;border-radius:6px;margin-top:8px}a{color:var(--primary)}dialog{margin:auto;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);padding:18px;width:92%;max-width:500px;max-height:88vh;overflow:auto}dialog::backdrop{background:#000b}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}.flashcard{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:#131d32;border:2px dashed var(--border);border-radius:14px;cursor:pointer;margin-bottom:16px}.flashcard .word{font-size:1.8rem;font-weight:800;color:var(--primary)}.flashcard .meaning{font-size:1.3rem;color:var(--success);margin-top:14px}.match-board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.match-col{display:flex;flex-direction:column;gap:8px}.match-btn{width:100%;min-height:50px;border:1px solid var(--border);background:#0f172a;padding:8px;font-size:.85rem;border-radius:8px}.match-btn.selected{border-color:var(--primary);background:#1e3a8a}.match-btn.matched{border-color:var(--success);background:#064e3b;opacity:.6;pointer-events:none}.feedback{padding:10px;margin-top:10px;border-radius:6px}.feedback.good{background:#064e3b;color:#6ee7b7}.feedback.bad{background:#450a0a;color:#fca5a5}[hidden]{display:none!important}@media(min-width:600px){.options-grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){button{padding:8px 10px}.nav-tabs button{font-size:.78rem}.item-card-header .actions{width:100%;justify-content:flex-end}}
</style>
<style>.main-nav{position:fixed;right:0;top:0;width:125px;min-height:100vh;background:#101a2d;border-left:1px solid #24324d;padding:24px 10px;display:flex;flex-direction:column;gap:8px;z-index:10}.main-nav a{color:#f1f5f9;text-decoration:none;padding:12px;border-radius:8px;background:#1a2744}.main-nav a[aria-current="page"]{background:#0369a1}body{padding-right:145px}@media(max-width:700px){.main-nav{position:static;width:auto;min-height:0;flex-direction:row;padding:8px;margin-bottom:12px}.main-nav a{flex:1;text-align:center}body{padding:12px}}</style></head>
<body><nav class="main-nav" aria-label="الأقسام"><a href="index.html" aria-current="page">القدرات</a><a href="tahsili.html">التحصيلي</a></nav>
<div class="container">
<header><div class="top-bar"><h1>أكاديمية القدرات</h1><button class="accent" onclick="openStarredPanel()">★ الأسئلة المميزة (<span id="starred-count">0</span>)</button></div><div class="nav-tabs"><button id="tab-questions" class="active" onclick="switchPage('questions')">بنك الأسئلة</button><button id="tab-words" onclick="switchPage('words')">معاني الكلمات</button><button id="tab-completed" onclick="switchPage('completed')">مكتملة المراجعة</button></div></header>
<div id="page-questions"><div class="card toolbar"><div class="actions"><button class="primary" onclick="startQuiz('all')">اختبار كافة الأسئلة</button><button onclick="openModal('modal-group')">+ مجموعة</button><button onclick="openModal('modal-section')">+ قسم</button><button onclick="openModal('modal-question')">+ سؤال</button></div><input type="file" id="json-input" accept=".json,application/json" hidden onchange="importJSON(event)"><button onclick="document.getElementById('json-input').click()">استيراد JSON</button></div><div id="questions-tree"></div></div>
<div id="page-words" hidden><div class="card actions"><button onclick="openModal('modal-word-group')">+ مجموعة كلمات</button><button onclick="openModal('modal-word')">+ إضافة كلمة</button></div><div id="words-tree"></div></div>
<div id="page-completed" hidden><div class="card"><h3 style="margin-bottom:12px">العناصر مكتملة المراجعة</h3><div id="completed-container"></div></div></div>
<div id="page-quiz" hidden style="display:none"><div id="quiz-mount"></div></div>
</div>
<dialog id="modal-starred"><div class="toolbar"><h3>★ الأسئلة المميزة</h3><button onclick="closeModal('modal-starred')">إغلاق</button></div><button class="primary" style="width:100%;margin:14px 0" onclick="startQuiz('starred')">اختبر على الأسئلة المميزة</button><div id="starred-items-list"></div></dialog>
<dialog id="modal-group"><h3>مجموعة أسئلة جديدة</h3><div class="form-group"><label for="group-name">اسم المجموعة</label><input id="group-name"></div><div class="dialog-footer"><button onclick="closeModal('modal-group')">إلغاء</button><button class="primary" onclick="saveGroup()">حفظ</button></div></dialog>
<dialog id="modal-section"><h3>قسم جديد</h3><div class="form-group"><label for="section-group-select">المجموعة الرئيسية</label><select id="section-group-select"></select></div><div class="form-group"><label for="section-num">رقم القسم</label><input type="number" id="section-num" placeholder="1"></div><div class="form-group"><label for="section-title">عنوان القسم</label><input id="section-title" placeholder="الهندسة والمثلثات"></div><div class="dialog-footer"><button onclick="closeModal('modal-section')">إلغاء</button><button class="primary" onclick="saveSection()">حفظ</button></div></dialog>
<dialog id="modal-question"><h3>إضافة سؤال جديد</h3><div class="form-group"><label>تصنيف السؤال</label><div class="toggle-group"><button type="button" id="btn-type-quant" onclick="selectQuestionType('كمي')">كمي</button><button type="button" id="btn-type-verbal" class="selected" onclick="selectQuestionType('لفظي')">لفظي</button></div></div><div class="form-group"><label for="q-group-select">المجموعة</label><select id="q-group-select" onchange="syncSectionDropdown()"></select></div><div class="form-group"><label for="q-section-select">القسم</label><select id="q-section-select"></select></div><div class="form-group"><label for="q-text">نص السؤال</label><textarea id="q-text" rows="3"></textarea></div><div class="two-cols"><div class="form-group"><label for="opt-0">خيار أ</label><input id="opt-0"></div><div class="form-group"><label for="opt-1">خيار ب</label><input id="opt-1"></div><div class="form-group"><label for="opt-2">خيار ج</label><input id="opt-2"></div><div class="form-group"><label for="opt-3">خيار د</label><input id="opt-3"></div></div><div class="form-group"><label for="q-correct">الخيار الصحيح</label><select id="q-correct"><option value="0">خيار أ</option><option value="1">خيار ب</option><option value="2">خيار ج</option><option value="3">خيار د</option></select></div><div class="form-group"><label for="q-file">مرفق: صورة حتى 4MB أو PDF حتى 20MB</label><input type="file" id="q-file" accept="image/*,application/pdf"></div><div class="dialog-footer"><button onclick="closeModal('modal-question')">إلغاء</button><button class="primary" onclick="saveQuestion()">حفظ السؤال</button></div></dialog>
<dialog id="modal-word-group"><h3>مجموعة مفردات جديدة</h3><div class="form-group"><label for="word-group-name">اسم المجموعة</label><input id="word-group-name"></div><div class="dialog-footer"><button onclick="closeModal('modal-word-group')">إلغاء</button><button class="primary" onclick="saveWordGroup()">حفظ</button></div></dialog>
<dialog id="modal-word"><h3>إضافة مفردة جديدة</h3><div class="form-group"><label for="word-group-select">مجموعة الكلمات</label><select id="word-group-select"></select></div><div class="form-group"><label for="word-text">الكلمة</label><input id="word-text"></div><div class="form-group"><label for="word-meaning">المعنى</label><textarea id="word-meaning" rows="2"></textarea></div><div class="dialog-footer"><button onclick="closeModal('modal-word')">إلغاء</button><button class="primary" onclick="saveWord()">حفظ الكلمة</button></div></dialog>
<dialog id="modal-vocab-quiz-setup"><h3>إعداد اختبار المفردات</h3><input type="hidden" id="vocab-quiz-group-id"><div class="form-group"><label for="vocab-scope">نطاق الكلمات</label><select id="vocab-scope"><option value="unreviewed">الكلمات غير المراجعة فقط</option><option value="starred">الكلمات المميزة بنجمة فقط</option><option value="all">كافة الكلمات</option></select></div><div class="form-group"><label for="vocab-mode">أسلوب الاختبار</label><select id="vocab-mode"><option value="flashcards">بطاقات استذكار</option><option value="mcq">اختيار من متعدد</option><option value="match">مطابقة الكلمة بمعناها</option></select></div><div class="dialog-footer"><button onclick="closeModal('modal-vocab-quiz-setup')">إلغاء</button><button class="primary" onclick="initiateVocabQuiz()">بدء الاختبار</button></div></dialog>
<script>
// File: index.html — UI and existing local-vault compatibility.
let db;
const DB_NAME='QuduratVault',DB_VER=2;
const vaultStores=['groups','sections','questions','wordGroups','words','files'];
const el=id=>document.getElementById(id);
function initDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=()=>{for(const store of vaultStores)if(!req.result.objectStoreNames.contains(store))req.result.createObjectStore(store,{keyPath:'id'});};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve();};req.onerror=()=>reject(req.error);req.onblocked=()=>alert('أغلق النوافذ الأخرى ثم أعد فتح التطبيق');});}
const dbOps={
 getAll:store=>new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);}),
 get:(store,id)=>new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);}),
 put:(store,data)=>new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(data);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);}),
 delete:(store,id)=>new Promise((resolve,reject)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);})
};
let currentQuestionType='لفظي',activeQuizList=[];
window.addEventListener('DOMContentLoaded',async()=>{await initDB();await refreshUI();});
async function openModal(id){if(id==='modal-section'||id==='modal-question')await syncGroupDropdowns();if(id==='modal-word')await syncWordGroupDropdown();if(id==='modal-question')selectQuestionType('لفظي');if(!el(id).open)el(id).showModal();}
function closeModal(id){el(id)?.close();}
function switchPage(page){for(const name of ['questions','words','completed','quiz']){el('page-'+name).hidden=page!==name;el('page-'+name).style.display=page===name?'block':'none';}for(const name of ['questions','words','completed'])el('tab-'+name).classList.toggle('active',page===name);if(page!=='quiz')refreshUI();}
function selectQuestionType(type){currentQuestionType=type;el('btn-type-quant').classList.toggle('selected',type==='كمي');el('btn-type-verbal').classList.toggle('selected',type==='لفظي');}
async function syncGroupDropdowns(){const groups=await dbOps.getAll('groups');for(const id of ['section-group-select','q-group-select'])el(id).innerHTML=groups.length?groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join(''):'<option value="">أنشئ مجموعة أولاً</option>';await syncSectionDropdown();}
async function syncSectionDropdown(){const sections=(await dbOps.getAll('sections')).filter(s=>String(s.groupId)===el('q-group-select').value);el('q-section-select').innerHTML=sections.length?sections.map(s=>`<option value="${s.id}">قسم ${s.num}: ${s.title}</option>`).join(''):'<option value="">لا توجد أقسام في المجموعة</option>';}
async function syncWordGroupDropdown(){const groups=await dbOps.getAll('wordGroups');el('word-group-select').innerHTML=groups.length?groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join(''):'<option value="">أنشئ مجموعة كلمات أولاً</option>';}
async function saveGroup(){const name=el('group-name').value.trim();if(!name)return alert('أدخل اسم المجموعة');await dbOps.put('groups',{id:uid('g'),name});el('group-name').value='';closeModal('modal-group');await refreshUI();}
async function saveSection(){const groupId=el('section-group-select').value,num=el('section-num').value.trim(),title=el('section-title').value.trim();if(!groupId)return alert('حدد المجموعة أولاً');if(!num||!title)return alert('أدخل رقم القسم وعنوانه');await dbOps.put('sections',{id:uid('s'),groupId,num,title});el('section-num').value='';el('section-title').value='';closeModal('modal-section');await refreshUI();}
async function saveWordGroup(){const name=el('word-group-name').value.trim();if(!name)return alert('أدخل اسم المجموعة');await dbOps.put('wordGroups',{id:uid('wg'),name});el('word-group-name').value='';closeModal('modal-word-group');await refreshUI();}
async function saveWord(){const groupId=el('word-group-select').value,word=el('word-text').value.trim(),meaning=el('word-meaning').value.trim();if(!groupId||!word||!meaning)return alert('أكمل المجموعة والكلمة والمعنى');await dbOps.put('words',{id:uid('w'),groupId,word,meaning,starred:false,completed:false});el('word-text').value='';el('word-meaning').value='';closeModal('modal-word');await refreshUI();}
async function toggleStar(store,id){const item=await dbOps.get(store,id);if(!item)return;item.starred=!item.starred;await dbOps.put(store,item);await refreshUI();}
async function toggleComplete(store,id,status){const item=await dbOps.get(store,id);if(!item)return;item.completed=status;await dbOps.put(store,item);await refreshUI();}
function qType(q){return q.type==='كمي'?'كمي':'لفظي';}
function buildQuestionCard(q,isCompleted=q.completed){const card=document.createElement('div');card.className='item-card';card.innerHTML=`<div class="item-card-header"><div><span class="badge ${q.type==='كمي'?'badge-quant':'badge-verbal'}">${qType(q)}</span> <span class="text">${q.text}</span></div><div class="actions"><button class="star-btn ${q.starred?'starred':''}" aria-label="تمييز السؤال" onclick="toggleStar('questions','${q.id}')">★</button><button class="${isCompleted?'':'success'}" onclick="toggleComplete('questions','${q.id}',${!isCompleted})">${isCompleted?'إعادة للتنشيط':'انتهت المراجعة'}</button><button class="danger icon-btn" aria-label="حذف السؤال" onclick="deleteQuestion('${q.id}')">🗑</button></div></div><div class="options-grid">${(q.options||[]).map((opt,i)=>`<div class="option-cell ${i===q.correct?'correct':''}">${['أ','ب','ج','د'][i]||i+1}: ${opt}</div>`).join('')}</div><div class="question-media"></div>`;if(q.fileId)renderMedia(q.fileId,card.querySelector('.question-media'));return card;}
function buildWordCard(w,completed=w.completed){const card=document.createElement('div');card.className='item-card';card.innerHTML=`<div class="item-card-header"><div><strong style="color:var(--primary)">${w.word}</strong>: <span class="text">${w.meaning}</span></div><div class="actions"><button class="star-btn ${w.starred?'starred':''}" aria-label="تمييز الكلمة" onclick="toggleStar('words','${w.id}')">★</button><button class="${completed?'':'success'}" onclick="toggleComplete('words','${w.id}',${!completed})">${completed?'إعادة للتنشيط':'انتهت المراجعة'}</button><button class="danger icon-btn" aria-label="حذف الكلمة" onclick="deleteWord('${w.id}')">🗑</button></div></div>`;return card;}
async function refreshUI(){
 const [groups,sections,questions,wordGroups,words]=await Promise.all(['groups','sections','questions','wordGroups','words'].map(s=>dbOps.getAll(s)));
 el('starred-count').textContent=questions.filter(q=>q.starred).length;
 const tree=el('questions-tree');tree.replaceChildren();if(!groups.length)tree.innerHTML='<div class="card muted">لا توجد مجموعات بعد. أضف مجموعة أو استورد ملف JSON.</div>';
 for(const g of groups){const box=document.createElement('div');box.className='group-box';const active=questions.filter(q=>String(q.groupId)===String(g.id)&&!q.completed);box.innerHTML=`<div class="group-head"><div><strong>${g.name}</strong> <span class="muted">(${active.length} سؤال نشط)</span></div><div class="actions"><button class="primary" onclick="startQuiz('group','${g.id}')">اختبار المجموعة</button><button class="danger icon-btn" aria-label="حذف المجموعة" onclick="deleteGroup('${g.id}')">🗑</button></div></div><div class="group-body"></div>`;const body=box.querySelector('.group-body'),gSections=sections.filter(s=>String(s.groupId)===String(g.id));if(!gSections.length)body.innerHTML='<div class="card muted">لا توجد أقسام في هذه المجموعة.</div>';for(const s of gSections){const qs=active.filter(q=>String(q.sectionId)===String(s.id)),section=document.createElement('div');section.className='section-box';section.innerHTML=`<div class="section-head"><div><strong>قسم ${s.num}: ${s.title}</strong> <span class="muted">(${qs.length} سؤال)</span></div><div class="actions"><button onclick="startQuiz('section','${s.id}')">اختبار القسم</button><button class="danger icon-btn" aria-label="حذف القسم" onclick="deleteSection('${s.id}')">🗑</button></div></div>`;for(const q of qs)section.append(buildQuestionCard(q));body.append(section);}tree.append(box);}
 const wt=el('words-tree');wt.replaceChildren();if(!wordGroups.length)wt.innerHTML='<div class="card muted">لا توجد مجموعات كلمات بعد.</div>';for(const g of wordGroups){const ws=words.filter(w=>String(w.groupId)===String(g.id)&&!w.completed),box=document.createElement('div');box.className='group-box';box.innerHTML=`<div class="group-head"><div><strong>${g.name}</strong> <span class="muted">(${ws.length} كلمة نشطة)</span></div><div class="actions"><button class="primary" onclick="openVocabQuizSetup('${g.id}')">اختبر المعاني</button><button class="danger icon-btn" aria-label="حذف مجموعة الكلمات" onclick="deleteWordGroup('${g.id}')">🗑</button></div></div><div class="word-list" style="padding:10px"></div>`;for(const w of ws)box.querySelector('.word-list').append(buildWordCard(w));wt.append(box);}
 const done=el('completed-container');done.replaceChildren();for(const q of questions.filter(q=>q.completed))done.append(buildQuestionCard(q,true));for(const w of words.filter(w=>w.completed))done.append(buildWordCard(w,true));if(!done.children.length)done.innerHTML='<p class="muted">لا توجد عناصر مكتملة حالياً.</p>';
}
const localMediaURLs=new Set();
async function renderMedia(fileId,container){const f=await dbOps.get('files',fileId);if(!f||!container||!(f.data instanceof Blob))return;const url=URL.createObjectURL(f.data);localMediaURLs.add(url);const node=document.createElement(f.type.startsWith('image/')?'img':'a');if(node.tagName==='IMG'){node.src=url;node.alt='مرفق السؤال';node.className='media-preview';}else{node.href=url;node.target='_blank';node.rel='noopener';node.textContent='📄 عرض المرفق: '+f.name;}container.replaceChildren(node);}
window.addEventListener('pagehide',()=>{for(const url of localMediaURLs)URL.revokeObjectURL(url);});

function runVocabMatching(items){const sample=shuffle(items).slice(0,6);el('quiz-mount').innerHTML='<div class="card"><h3>مطابقة الكلمات</h3><p class="muted">اختر كلمة ثم اختر معناها.</p><p id="match-score"></p></div><div class="match-board"><div class="match-col" id="col-words"></div><div class="match-col" id="col-meanings"></div></div><button onclick="switchPage(\'words\')">إنهاء</button>';let word=null,meaning=null,locked=false,matched=0;const buttons={words:new Map(),meanings:new Map()};const choose=(kind,item,button)=>{if(locked||button.classList.contains('matched'))return;for(const b of buttons[kind].values())b.classList.remove('selected');button.classList.add('selected');if(kind==='words')word=item;else meaning=item;if(!word||!meaning)return;locked=true;const left=buttons.words.get(word.id),right=buttons.meanings.get(meaning.id);if(word.id===meaning.id){left.classList.add('matched');right.classList.add('matched');left.classList.remove('selected');right.classList.remove('selected');el('match-score').textContent=`تمت مطابقة ${++matched} من ${sample.length}`;word=meaning=null;locked=false;}else setTimeout(()=>{left.classList.remove('selected');right.classList.remove('selected');word=meaning=null;locked=false;},400);};for(const kind of ['words','meanings'])for(const item of shuffle(sample)){const button=document.createElement('button');button.className='match-btn';button.textContent=kind==='words'?item.word:item.meaning;button.onclick=()=>choose(kind,item,button);buttons[kind].set(item.id,button);el(kind==='words'?'col-words':'col-meanings').append(button);}}

// Numeric correct/correctIndex values are ZERO-BASED unless indexBase:1 is explicit.
function str(value){return value==null?'':String(value).trim();}
function uid(prefix){return prefix+'_'+crypto.randomUUID().replaceAll('-','');}
function normalizeQuestion(item) {
 const text=str(item.text ?? item.question);
 if(!text)throw new Error('نص السؤال مفقود (text أو question)');
 let raw=item.options ?? item.choices;
 if(raw && !Array.isArray(raw) && typeof raw==='object') {
  const keys=['A','B','C','D'].some(k=>k in raw)?['A','B','C','D']:['أ','ب','ج','د'];
  raw=keys.map(k=>raw[k]??'');
 }
 if(!Array.isArray(raw))throw new Error('options يجب أن تكون مصفوفة أو خيارات A/B/C/D');
 if(raw.some(x=>x!=null && !['string','number'].includes(typeof x)))throw new Error('الخيارات يجب أن تكون نصوصاً أو أرقاماً');
 const entries=raw.map((v,i)=>({text:str(v),i})).filter(v=>v.text);
 if(!entries.length)throw new Error('لا توجد خيارات');
 const value=item.correctIndex ?? item.correct ?? item.answer;
 if(value===undefined || value===null || value==='')throw new Error('الإجابة الصحيحة مفقودة');
 let original;
 if(typeof value==='number' || /^\d+$/.test(str(value)))original=Number(value)-(Number(item.indexBase)===1?1:0);
 else {
  const label=str(value).toUpperCase();
  if(['A','B','C','D','أ','ب','ج','د'].includes(label))original=(['A','B','C','D'].includes(label)?['A','B','C','D']:['أ','ب','ج','د']).indexOf(label);
  else {
   const matches=entries.filter(x=>x.text===str(value));
   if(matches.length!==1)throw new Error('نص الإجابة غير موجود أو مكرر؛ استخدم رقم الخيار');
   original=matches[0].i;
  }

 const correct=entries.findIndex(x=>x.i===original);
 if(!Number.isInteger(original)||correct<0)throw new Error('رقم الإجابة غير صالح أو يشير إلى خيار فارغ');
 return {text,options:entries.map(x=>x.text),correct,type:item.type==='كمي'?'كمي':'لفظي'};
}
function flattenImport(input){
 if(Array.isArray(input))return input;
 if(input && typeof input==='object'){
  if(Array.isArray(input.questions)||Array.isArray(input.words))return [...(input.questions||[]),...(input.words||[])];
  if(Array.isArray(input.groups))return input.groups.flatMap(g=>{
   if(!Array.isArray(g.sections))throw new Error('كل مجموعة تحتاج sections');
   return g.sections.flatMap(s=>{
    if(!Array.isArray(s.questions))throw new Error('كل قسم يحتاج questions');
    return s.questions.map(q=>({...q,group:g.name,sectionNum:s.num??s.sectionNum??1,sectionTitle:s.title??s.name??'القسم العام'}));
   });

}
function buildImport(input,current){
 const items=flattenImport(input),ops=[];
 const groups=[...current.groups],sections=[...current.sections],wordGroups=[...current.wordGroups];
 const qKeys=new Set(current.questions.map(q=>JSON.stringify([q.groupId,q.sectionId,q.type,q.text,q.options,q.correct])));
 const wKeys=new Set(current.words.map(w=>JSON.stringify([w.groupId,w.word,w.meaning])));
 let questions=0,words=0,duplicates=0;
 const put=(store,data)=>ops.push({kind:'put',store,id:data.id,data});
 items.forEach((item,index)=>{
  try{
   if(!item||typeof item!=='object'||Array.isArray(item))throw new Error('العنصر ليس كائناً');
   if('word' in item || 'meaning' in item){
    const word=str(item.word),meaning=str(item.meaning);if(!word||!meaning)throw new Error('الكلمة أو المعنى مفقود');
    const name=str(item.group)||'مفردات عامة';let g=wordGroups.find(g=>g.name===name);
    if(!g){g={id:uid('wg'),name};wordGroups.push(g);put('wordGroups',g);}
    const key=JSON.stringify([g.id,word,meaning]);if(wKeys.has(key)){duplicates++;return;}wKeys.add(key);
    put('words',{id:uid('w'),groupId:g.id,word,meaning,starred:false,completed:false});words++;return;
   }
   const question=normalizeQuestion(item);
   const name=str(item.group)||'تجميعات القدرات';let g=groups.find(g=>g.name===name);
   if(!g){g={id:uid('g'),name};groups.push(g);put('groups',g);}
   const num=str(item.sectionNum??1),title=str(item.sectionTitle??item.section)||'القسم العام';
   let s=sections.find(s=>s.groupId===g.id && String(s.num)===num && s.title===title);
   if(!s){s={id:uid('s'),groupId:g.id,num,title};sections.push(s);put('sections',s);}

   if(qKeys.has(key)){duplicates++;return;}qKeys.add(key);
   put('questions',{id:uid('q'),groupId:g.id,sectionId:s.id,...question,fileId:null,starred:false,completed:false});questions++;
  }catch(error){throw new Error(`العنصر ${index+1}: ${error.message}`);}

}


const SYNC_STORES=['groups','sections','questions','wordGroups','words','files'];
function emptySyncStores(){return Object.fromEntries(SYNC_STORES.map(s=>[s,[]]));}
function wireRecord(data){const result={...data};delete result.data;return result;}
function sameRecord(a,b){return JSON.stringify(a??null)===JSON.stringify(b??null);}
class ManualSync {
 constructor({api,load,save,fetcher=(...args)=>window.fetch(...args),onChange=()=>{}}){this.api=api.replace(/\/$/,'');this.load=load;this.save=save;this.fetcher=fetcher;this.onChange=onChange;this.syncing=false;this.ready=this.initialize();}

 async persist(){await this.save(structuredClone(this.state));this.onChange();}
 async edit(ops,wipe=false){await this.ready;const previous=structuredClone(this.state);try{if(wipe){this.state.working=emptySyncStores();this.state.wipe=true;}for(const op of ops){const list=this.state.working[op.store];const i=list.findIndex(x=>x.id===op.id);if(i>=0)list.splice(i,1);if(op.kind==='put')list.push(structuredClone(op.data));}await this.persist();}catch(error){this.state=previous;this.onChange();throw error;}}
 async request(path,init={}){
  const method=init.method||'GET',url=this.api+path;let response;
  try{response=await this.fetcher(url,{...init,cache:'no-store',signal:AbortSignal.timeout(60000)});}catch(cause){const error=new Error(cause.message||'Network request failed');error.details={url,method,name:cause.name,message:error.message};throw error;}
  const text=await response.text();let body;try{body=JSON.parse(text);}catch{}
  if(!response.ok){const error=new Error(body?.error||`HTTP ${response.status}`);error.details={url,method,status:response.status,statusText:response.statusText,response:text,message:error.message};throw error;}
  if(!body){const error=new Error('Server returned invalid JSON');error.details={url,method,status:response.status,response:text,message:error.message};throw error;}return body;

 async sync({force=false,discard=false}={}){
  await this.ready;if(this.syncing)return;this.syncing=true;this.onChange();
  try{
   if(!this.api)throw new Error('لم يتم إعداد عنوان الخادم في QUDURATY_API');
   let remote=await this.request('/state');
   if(!remote.stores||!Number.isSafeInteger(remote.revision))throw new Error('Invalid server snapshot');
   if(discard){this.state={base:remote,working:structuredClone(remote.stores),wipe:false,lastSuccess:new Date().toISOString(),lastError:null,localDirty:false};await this.persist();return;}
   if(this.state.wipe){
    if(SYNC_STORES.some(s=>remote.stores[s].length)){const result=await this.request('/wipe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:remote.revision})});remote={revision:result.revision,stores:emptySyncStores()};}
    this.state.base=structuredClone(remote);this.state.wipe=false;await this.persist();
   }
   let ops=this.changes();const conflicts=[];
   for(const op of ops){const base=this.state.base.stores[op.store].find(x=>x.id===op.id);const current=remote.stores[op.store].find(x=>x.id===op.id);const wanted=op.kind==='put'?wireRecord(op.data):undefined;if(!sameRecord(current,base)&&!sameRecord(current,wanted))conflicts.push({store:op.store,id:op.id});}
   if(conflicts.length&&!force){const error=new Error('توجد تغييرات متعارضة على جهاز آخر. التغييرات المحلية محفوظة؛ اختر طريقة الحل من لوحة الخطأ.');error.details={name:'SyncConflict',message:error.message,conflicts,serverRevision:remote.revision,localRevision:this.state.base.revision};throw error;}
   if(ops.length>2000)throw new Error('أكثر من 2000 تغيير معلق؛ حد دفعة الخادم 2000 عملية');

   for(const op of ops.filter(x=>x.kind==='put'&&x.store==='files')){

   }
   ops=ops.map(op=>op.kind==='put'?{...op,data:wireRecord(op.data)}:op).filter(op=>!sameRecord(remote.stores[op.store].find(x=>x.id===op.id),op.kind==='put'?op.data:undefined));
   if(ops.length){const result=await this.request('/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:remote.revision,ops})});
    for(const op of ops){const list=remote.stores[op.store];const i=list.findIndex(x=>x.id===op.id);if(i>=0)list.splice(i,1);if(op.kind==='put')list.push(op.data);}remote.revision=result.revision;
   }
   // Checkpoint the acknowledged write before anything else; no second network read is needed.
   this.state={base:remote,working:structuredClone(remote.stores),wipe:false,lastSuccess:new Date().toISOString(),lastError:null,localDirty:false};await this.persist();
  }catch(error){this.state.lastError={time:new Date().toISOString(),...(error.details||{name:error.name,message:error.message})};await this.persist();throw error;}
  finally{this.syncing=false;this.onChange();}

}

  else{for(const control of disabledControls)control.disabled=false;disabledControls.clear();}

 const engine=new ManualSync({api,load:cacheRead,save:cacheWrite,onChange:updateIndicator});
 function enqueue(action){const work=queue.then(action);queue=work.catch(()=>{});return work;}

 function localBatch(ops,wipe=false){
  return new Promise((resolve,reject)=>{
   const tx=db.transaction(stores,'readwrite');
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transaction aborted'));
   if(wipe)for(const store of stores)tx.objectStore(store).clear();
   for(const op of ops){const store=tx.objectStore(op.store);op.kind==='delete'?store.delete(op.id):store.put(op.data);}
  });
 }
 function batch(ops,wipe=false){return enqueue(async()=>{if(api)await engine.edit(ops,wipe);else{await localBatch(ops,wipe);await engine.ready;engine.state.localDirty=true;await engine.persist();}});}

 function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function displayRecord(record){
  const result={...record};for(const key of ['name','title','num','text','word','meaning'])if(typeof result[key]==='string')result[key]=escapeHTML(result[key]);
  if(Array.isArray(result.options))result.options=result.options.map(escapeHTML);return result;
 }

 // Replace sequential cascades with one atomic metadata transaction.
 async function cascade(kind,id,message){
  if(!confirm(message))return;
  const ops=[],del=(store,id)=>ops.push({kind:'delete',store,id});
  if(kind==='groups'||kind==='sections'||kind==='questions'){
   const questions=await rawAll('questions');
   for(const q of questions.filter(q=>kind==='groups'?q.groupId===id:kind==='sections'?q.sectionId===id:q.id===id)){if(q.fileId)del('files',q.fileId);del('questions',q.id);}
   if(kind==='groups')for(const s of (await rawAll('sections')).filter(s=>s.groupId===id))del('sections',s.id);
  }
  if(kind==='wordGroups')for(const w of (await rawAll('words')).filter(w=>w.groupId===id))del('words',w.id);
  if(kind!=='questions')del(kind,id);
  await batch(ops);await refreshUI();
 }
